name: "Supabase Keep-Alive Bot"

on:
  schedule:
    # Se ejecuta cada 3 días a las 06:00 UTC para prevenir la suspensión por inactividad
    - cron: '0 6 */3 * *'
  workflow_dispatch: # Permite ejecución manual desde GitHub Actions

jobs:
  ping-supabase:
    name: "Ping Supabase REST Health"
    runs-on: ubuntu-latest
    steps:
      - name: "Validar Variables de Entorno"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "⚠️ [ALERTA]: SUPABASE_URL o SUPABASE_ANON_KEY no están configurados en los secretos del repositorio."
            echo "Por favor, añada SUPABASE_URL y SUPABASE_ANON_KEY en Settings -> Secrets and variables -> Actions."
            exit 0
          fi
          echo "✅ Secretos de Supabase detectados. Iniciando ping de actividad..."

      - name: "Ejecutar Ping a la API de Supabase"
        if: env.SUPABASE_URL != '' && env.SUPABASE_ANON_KEY != ''
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          echo "📡 Enviando petición Keep-Alive a: $SUPABASE_URL/rest/v1/"
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/")

          echo "HTTP Status Code recibido: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then
            echo "🟢 [ÉXITO]: Ping completado. Proyecto de Supabase activo y saludable."
          else
            echo "🟡 [AVISO]: Código HTTP $HTTP_STATUS recibido. La instancia ha registrado la petición activa."
          fi
